name: action-v0-3-2-consumer-probe

on:
  workflow_dispatch:
  push:
    branches:
      - codex/probe-action-0-3-2

permissions:
  contents: read

jobs:
  root-action-consumer:
    name: Consumer resolves root v0.3.2 reference
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Run the public root Action exactly as a consumer does
        uses: BargLabs/cejel@v0.3.2
        with:
          out-dir: .cejel/action-v032
      - name: Print the version executed by the root Action
        run: >-
          node -e "const a=require('./.cejel/action-v032/attestation.json');
          console.log('ROOT_V032_ACTION_VERSION=' + a.predicate.tool.version)"
