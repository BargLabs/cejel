name: Calibration signature guard

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.23.1
      - name: Run the check's own tests before trusting it
        run: node --test scripts/check-calibration-signatures.node-test.mjs
      - name: Verify every calibration commit in this pull request
        run: |
          node scripts/check-calibration-signatures.mjs \
            "origin/${{ github.base_ref }}...HEAD"
