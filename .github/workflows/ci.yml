name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Assert devDependency install environment
        run: node scripts/assert-dev-environment.mjs --phase=preinstall

      - run: pnpm install --frozen-lockfile
      - run: pnpm run typecheck
      - run: pnpm run build
      - run: pnpm run validate:distribution
      - name: Check public board surfaces
        run: |
          node --test scripts/verify-board-surfaces.node-test.mjs scripts/b4-commit-year-v19-paired-rescore.node-test.mjs scripts/a2-v24-paired-rescore.node-test.mjs
          node scripts/verify-board-surfaces.mjs
      - run: pnpm test
      - name: SBOM generator and empty-inventory check tests
        run: pnpm run test:sbom
      - name: Release driver tests
        run: pnpm run test:release

      - name: Release currency verifier, version bump and dist-tag tests
        run: node --test scripts/verify-release-currency.node-test.mjs scripts/bump-release-version.node-test.mjs scripts/release-version.node-test.mjs

      - name: Self-certify (dogfood)
        run: node dist/index.js .

      - name: Smoke-test the root candidate Action
        uses: ./
        with:
          out-dir: .cejel-action

      - name: Smoke-test the nested compatibility Action
        uses: ./action
        with:
          out-dir: .cejel-action-nested

      - name: Verify candidate Action artifacts
        run: |
          test -s .cejel-action/report.json
          test -s .cejel-action/certificate.html
          test -s .cejel-action/summary.json
          test -s .cejel-action-nested/report.json
          test -s .cejel-action-nested/certificate.html
          test -s .cejel-action-nested/summary.json

      - name: Upload candidate Action certificate
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: cejel-action-certificate
          path: |
            .cejel-action/
            .cejel-action-nested/
          include-hidden-files: true
          if-no-files-found: error

      - name: Build Docker image
        run: docker build --tag cejel:ci .

      - name: Build calibration no-egress runtime
        run: docker build --tag cejel-calibration:no-egress-test --file calibration/llm/Dockerfile.no-egress .

      - name: Verify the host no-egress execution boundary
        env:
          CEJEL_CALIBRATION_NO_EGRESS_TEST_IMAGE: cejel-calibration:no-egress-test
        run: node --test calibration/llm/scripts/execution-integrity.node-test.mjs

      - name: Smoke-test Docker CLI and MCP ownership label
        run: |
          test "$(docker run --rm cejel:ci --version)" = "$(node -p "require('./package.json').version")"
          docker run --rm cejel:ci --help | grep -q '^cejel'
          test "$(docker run --rm --entrypoint cejel cejel:ci --version)" = "$(node -p "require('./package.json').version")"
          docker run --rm cejel:ci
          test "$(docker inspect cejel:ci --format '{{ index .Config.Labels "io.modelcontextprotocol.server.name" }}')" = "io.github.BargLabs/cejel"

  # Runs both Action manifests the way a consumer does: from a workspace whose own package.json pins a
  # different pnpm. The smoke steps in build-test run in this repository, whose packageManager matches
  # the Action's, so they never saw the failure this job guards against. pnpm/action-setup read the
  # CALLER's packageManager and refused it beside the Action's hardcoded version ("Multiple versions of
  # pnpm specified"). It also checks that the caller's own pnpm survives both Actions (#686).
  action-from-another-caller:
    # Linux, macOS and Windows: the Action runs in callers on all three (#690). fail-fast is off so
    # one OS failing does not hide the others' results.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    # The job's own steps are bash on every OS; on Windows the default would be pwsh.
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          path: cejel
          fetch-depth: 0

      - name: Make the workspace a caller that pins a different pnpm
        run: |
          printf '{\n  "name": "caller",\n  "private": true,\n  "packageManager": "pnpm@10.0.0"\n}\n' > package.json
          cat package.json

      # The caller's own pnpm, on a PATH entry of its own. The Action must neither replace it nor
      # change PNPM_HOME for the steps after it (#686): pnpm/action-setup prepended its pnpm to the
      # job-wide PATH, so a caller's later pnpm steps ran the Action's version instead of their own.
      - name: Give the caller its own pnpm
        run: |
          npm install --no-save --no-audit --no-fund --prefix "$RUNNER_TEMP/caller-pnpm" pnpm@10.0.0
          echo "$RUNNER_TEMP/caller-pnpm/node_modules/.bin" >> "$GITHUB_PATH"
          echo "CALLER_PNPM_HOME=${PNPM_HOME:-unset}" >> "$GITHUB_ENV"

      - name: The caller's pnpm before the Action
        run: test "$(pnpm --version)" = "10.0.0"

      # The Action must refuse a pnpm tarball whose sha512 differs from its packageManager pin, and
      # refuse it before installing anything (#686 item 6). A copy of the Action with one hex digit
      # of the pin changed runs first, so the only cejel-pnpm.* directory afterwards is its own: it
      # must hold the fetched tarball and no node_modules.
      - name: Copy the Action with a wrong pnpm sha512 pin
        run: |
          if compgen -G "$RUNNER_TEMP/cejel-pnpm.*" > /dev/null; then
            echo "::error::a cejel-pnpm directory exists before the wrong-pin run"
            exit 1
          fi
          mkdir cejel-wrong-pin
          git -C cejel archive HEAD | tar -x -C cejel-wrong-pin
          node -e '
            const fs = require("fs");
            const file = "cejel-wrong-pin/package.json";
            const manifest = JSON.parse(fs.readFileSync(file, "utf8"));
            const pin = manifest.packageManager;
            const wrong = pin.replace(/\+sha512\.(.)/, (_, digit) => "+sha512." + (digit === "0" ? "1" : "0"));
            if (wrong === pin) throw new Error("the pin was not changed: " + pin);
            manifest.packageManager = wrong;
            fs.writeFileSync(file, JSON.stringify(manifest, null, 2) + "\n");
            console.log(pin + "\n" + wrong);
          '

      - name: Wrong-pin Action from the caller workspace
        id: wrong-pin
        continue-on-error: true
        uses: ./cejel-wrong-pin
        with:
          repo-path: cejel
          out-dir: .cejel-wrong-pin

      - name: The wrong pin was refused before pnpm was installed
        env:
          OUTCOME: ${{ steps.wrong-pin.outcome }}
        run: |
          test "$OUTCOME" = "failure"
          dirs=("$RUNNER_TEMP"/cejel-pnpm.*)
          test "${#dirs[@]}" = 1
          ls -la "${dirs[0]}"
          compgen -G "${dirs[0]}/pnpm-*.tgz"
          test ! -e "${dirs[0]}/node_modules"
          test ! -e cejel-wrong-pin/node_modules
          test ! -e .cejel-wrong-pin
          test "$(pnpm --version)" = "10.0.0"

      - name: Root Action from the caller workspace
        uses: ./cejel
        with:
          repo-path: cejel
          out-dir: .cejel-caller

      - name: The caller's pnpm is unchanged after the root Action
        run: |
          echo "pnpm $(pnpm --version) at $(command -v pnpm); PNPM_HOME=${PNPM_HOME:-unset}"
          test "$(pnpm --version)" = "10.0.0"
          test "${PNPM_HOME:-unset}" = "$CALLER_PNPM_HOME"

      - name: Nested Action from the caller workspace
        uses: ./cejel/action
        with:
          repo-path: cejel
          out-dir: .cejel-caller-nested

      - name: The caller's pnpm is unchanged after the nested Action
        run: |
          echo "pnpm $(pnpm --version) at $(command -v pnpm); PNPM_HOME=${PNPM_HOME:-unset}"
          test "$(pnpm --version)" = "10.0.0"
          test "${PNPM_HOME:-unset}" = "$CALLER_PNPM_HOME"

      - name: Verify both produced a certificate
        run: |
          test -s .cejel-caller/report.json
          test -s .cejel-caller/certificate.html
          test -s .cejel-caller-nested/report.json
          test -s .cejel-caller-nested/certificate.html
