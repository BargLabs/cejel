name: Cited commits resolve

# Every cejel commit cited in the experiment record must be reachable from main or from an
# evidence/* tag (#368). See the header of scripts/check-cited-commits.mjs for the rules.

on:
  pull_request:
    branches: [main]
    paths:
      - 'docs/experiments/**'
      - 'leaderboard/RUBRIC_CHANGELOG.md'
      - 'scripts/check-cited-commits.mjs'
      - 'scripts/check-cited-commits.node-test.mjs'
      - '.github/workflows/cited-commits.yml'
  push:
    branches: [main]
  schedule:
    - cron: '45 6 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.23.1
      - name: Run the check's own tests before trusting it
        run: node --test scripts/check-cited-commits.node-test.mjs
      # A squash-merged branch's commits survive only under refs/pull/*/head. Fetching them
      # makes a squashed-away preregistration a findable, unreachable commit instead of a token
      # that resolves to nothing. These refs never count as reachability.
      - name: Fetch evidence tags and pull-request heads
        run: |
          git fetch --no-tags --quiet origin '+refs/tags/evidence/*:refs/tags/evidence/*'
          git fetch --no-tags --quiet origin '+refs/pull/*/head:refs/remotes/origin-pr/*'
      - name: Check cited commits (pull request; PR-only commits are reported as pending)
        if: github.event_name == 'pull_request'
        run: node scripts/check-cited-commits.mjs --main-ref origin/main --pending-ref HEAD
      - name: Check cited commits against main
        if: github.event_name != 'pull_request'
        run: node scripts/check-cited-commits.mjs --main-ref origin/main
