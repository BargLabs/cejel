name: Measurement freeze

on:
  pull_request:
    branches: [main]
  schedule:
    - cron: '25 6 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  measurement-freeze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.23.1
      - name: Run the check's own tests before trusting it
        run: node --test scripts/check-measurement-freeze.node-test.mjs
      - name: Refuse scoring source and declaration changes
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: node scripts/check-measurement-freeze.mjs --base "$BASE_SHA" --head "$HEAD_SHA"
      - name: Sweep the complete tracked tree against the frozen revision
        if: github.event_name != 'pull_request'
        run: node scripts/check-measurement-freeze.mjs --full-tree --head HEAD
