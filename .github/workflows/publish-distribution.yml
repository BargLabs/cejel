name: Publish OCI image and MCP Registry metadata

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Published release tag; must equal v<package version>
        required: true
        type: string
      publish_mcp_registry:
        description: Publish server.json to the Official MCP Registry with an immutable OCI digest reference
        required: true
        default: false
        type: boolean
      reuse_published_oci_tag:
        description: Resolve an existing release OCI tag for MCP publication or verification; do not rebuild the image
        required: true
        default: false
        type: boolean
      verify_only:
        description: Verify the tag, npm package, and distribution metadata without publishing
        required: true
        default: true
        type: boolean

concurrency:
  group: cejel-distribution-${{ inputs.release_tag }}
  cancel-in-progress: false

env:
  IMAGE_NAME: ghcr.io/barglabs/cejel

jobs:
  preflight:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Checkout the dispatched release tag
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6

      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'

      - name: Require an exact, dispatched release tag and matching distribution metadata
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "$RELEASE_TAG" != "v$version" ]; then
            echo "release tag $RELEASE_TAG does not match package version $version" >&2
            exit 1
          fi
          scripts/assert-release-identity.sh
          test "$(npm view "@cejel/cejel@$version" version)" = "$version"
          test "$(npm view "@cejel/cejel@$version" mcpName)" = "io.github.BargLabs/cejel"
          pnpm install --frozen-lockfile
          pnpm run validate:distribution

  # The image's bundle SBOM is generated and checked here, in a read-only job, BEFORE anything is
  # published (review of #404). It is computed from the Dockerfile's own `build` stage (exported
  # with buildx, no push), so it describes the image's build, not a separate runner rebuild; the
  # dependency install happens inside that container build, never on a runner that holds registry
  # credentials, packages: write or an OIDC token. It also records the build stage's dist/ hashes,
  # which publish-oci checks against the pushed image before attesting anything. Runs in
  # verify-only mode too.
  bundle-sbom:
    needs: preflight
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Checkout the dispatched release tag
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      - name: Assert release identity
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: scripts/assert-release-identity.sh

      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      # BuildKit's `sbom: true` (publish-oci) inventories the image's base layers but cannot see what
      # tsup bundled into dist/ (package.json declares no dependencies); the bundler metafile is
      # written inside the build stage.
      # Same script as CI's oci-sbom-binding job. amd64 and arm64 build stages produce byte-identical dist/.
      - name: Generate and check the bundle SBOM from the image's build stage
        run: scripts/sbom/image-bundle-sbom.sh "$RUNNER_TEMP/handoff" linux/amd64

      - name: Hand the checked SBOM and the build's dist hashes to publish-oci
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: cejel-bundle-sbom
          path: |
            ${{ runner.temp }}/handoff/cejel-bundle.spdx.json
            ${{ runner.temp }}/handoff/dist.sha256
          if-no-files-found: error
          retention-days: 7

  publish-oci:
    needs: [preflight, bundle-sbom]
    if: ${{ inputs.verify_only == false && inputs.reuse_published_oci_tag == false }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
      artifact-metadata: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - name: Checkout the dispatched release tag
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      - name: Assert release identity
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: scripts/assert-release-identity.sh

      - name: Login to GitHub Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Download the bundle SBOM checked by bundle-sbom
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: cejel-bundle-sbom
          path: ${{ runner.temp }}/bundle-sbom

      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'

      # The checker uses only Node built-ins: no dependency install in this privileged job.
      - name: Re-check the downloaded bundle SBOM before publishing
        run: node scripts/sbom/check-sbom-inventory.mjs "$RUNNER_TEMP/bundle-sbom/cejel-bundle.spdx.json" --require zod --require @modelcontextprotocol/sdk

      - name: Refuse to overwrite a published OCI release tag
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: scripts/assert-oci-tag-unpublished.sh

      - name: Generate image tags and labels
        id: metadata
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}},value=${{ inputs.release_tag }}
            type=raw,value=latest

      - name: Build and publish multi-platform image
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          # Pushed by digest only, with NO tags (third review of #404): the version and `latest`
          # tags are applied only after the dist/ comparison and both attestations, so a failed
          # check leaves an untagged digest and the release can be re-run.
          outputs: type=image,name=${{ env.IMAGE_NAME }},push-by-digest=true,name-canonical=true,push=true
          labels: ${{ steps.metadata.outputs.labels }}
          build-args: VERSION=${{ steps.metadata.outputs.version }}
          sbom: true
          provenance: mode=max

      # Binds the attested SBOM to the bytes actually pushed: both platforms' dist/ must equal the
      # build stage the SBOM was computed from. Same script as CI's oci-sbom-binding job.
      - name: Verify the pushed image carries the dist the SBOM was computed from
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: scripts/sbom/verify-image-dist.sh "$IMAGE_NAME" "$DIGEST" "$RUNNER_TEMP/bundle-sbom/dist.sha256"

      - name: Create signed image provenance
        uses: actions/attest@f7c74d28b9d84cb8768d0b8ca14a4bac6ef463e6 # v4
        with:
          subject-name: ${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

      # Generated from the image's own build stage and checked in bundle-sbom, re-checked above
      # before the push, and bound to the pushed bytes by the dist/ comparison; here it is attested.
      - name: Attest the bundle SBOM to the image digest
        uses: actions/attest@f7c74d28b9d84cb8768d0b8ca14a4bac6ef463e6 # v4
        with:
          subject-name: ${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.build.outputs.digest }}
          sbom-path: ${{ runner.temp }}/bundle-sbom/cejel-bundle.spdx.json
          push-to-registry: true

      # Only now, after the dist/ comparison and both attestations, does the image get its tags; each
      # tag must resolve to the attested digest. Same script as CI's oci-sbom-binding job.
      - name: Tag the verified, attested image
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          TAGS: ${{ steps.metadata.outputs.tags }}
        run: scripts/sbom/tag-verified-image.sh "$IMAGE_NAME" "$DIGEST" "$TAGS"

  resolve-mcp-oci-digest:
    needs: [preflight, publish-oci]
    if: ${{ always() && inputs.publish_mcp_registry && needs.preflight.result == 'success' && (inputs.reuse_published_oci_tag || (inputs.verify_only == false && needs.publish-oci.result == 'success')) }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: read
    outputs:
      digest: ${{ steps.resolve.outputs.digest }}
    steps:
      - name: Checkout the dispatched release tag
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      - name: Assert release identity
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: scripts/assert-release-identity.sh

      - name: Login to GitHub Container Registry
        if: ${{ inputs.reuse_published_oci_tag }}
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve immutable OCI manifest digest
        id: resolve
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
          PUBLISHED_OCI_DIGEST: ${{ needs.publish-oci.outputs.digest }}
          REUSE_PUBLISHED_OCI_TAG: ${{ inputs.reuse_published_oci_tag }}
        run: |
          if [ "$REUSE_PUBLISHED_OCI_TAG" = true ]; then
            digest="$(docker buildx imagetools inspect "$IMAGE_NAME:${RELEASE_TAG#v}" --format '{{.Manifest.Digest}}')"
          else
            digest="$PUBLISHED_OCI_DIGEST"
          fi
          if [[ ! "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "OCI digest is missing or malformed: $digest" >&2
            exit 1
          fi
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          echo "Resolved OCI digest $digest"

  publish-mcp-registry:
    needs: resolve-mcp-oci-digest
    if: ${{ always() && inputs.verify_only == false && needs.resolve-mcp-oci-digest.result == 'success' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout the dispatched release tag
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      - name: Assert release identity
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: scripts/assert-release-identity.sh

      - name: Install the Official MCP Registry publisher
        env:
          MCP_PUBLISHER_VERSION: v1.8.0
          MCP_PUBLISHER_LINUX_AMD64_SHA256: 1370446bbe74d562608e8005a6ccce02d146a661fbd78674e11cc70b9618d6cf
          MCP_PUBLISHER_LINUX_ARM64_SHA256: c978982c60e1b4903a976de090f04dc4fac4a320daa50704fcad2dbc93433d62
        run: |
          architecture="$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/')"
          asset="mcp-publisher_linux_${architecture}.tar.gz"
          case "$architecture" in
            amd64) expected_sha256="$MCP_PUBLISHER_LINUX_AMD64_SHA256" ;;
            arm64) expected_sha256="$MCP_PUBLISHER_LINUX_ARM64_SHA256" ;;
            *) echo "Unsupported MCP publisher architecture: $architecture" >&2; exit 1 ;;
          esac
          curl --fail --location --proto '=https' --tlsv1.2 \
            "https://github.com/modelcontextprotocol/registry/releases/download/${MCP_PUBLISHER_VERSION}/${asset}" \
            --output "$asset"
          printf '%s  %s\n' "$expected_sha256" "$asset" | sha256sum --check -
          tar -xzf "$asset" mcp-publisher

      - name: Authenticate with GitHub OIDC
        run: ./mcp-publisher login github-oidc

      - name: Validate registry metadata
        env:
          MCP_OCI_DIGEST: ${{ needs.resolve-mcp-oci-digest.outputs.digest }}
        run: |
          node scripts/prepare-mcp-server-metadata.mjs "$MCP_OCI_DIGEST"
          node scripts/validate-distribution-metadata.mjs

      - name: Publish server metadata
        run: ./mcp-publisher publish

  verify-mcp-oci-release-chain:
    needs: [resolve-mcp-oci-digest, publish-mcp-registry]
    if: ${{ always() && inputs.verify_only == false && needs.publish-mcp-registry.result == 'success' && needs.resolve-mcp-oci-digest.result == 'success' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: read
      attestations: read
    steps:
      - name: Checkout the dispatched release tag
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      - name: Assert release identity
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: scripts/assert-release-identity.sh

      - name: Login to GitHub Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Read back Registry record and verify signed OCI source
        env:
          GH_TOKEN: ${{ github.token }}
          MCP_OCI_DIGEST: ${{ needs.resolve-mcp-oci-digest.outputs.digest }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          version="${RELEASE_TAG#v}"
          source_commit="$(git rev-parse HEAD)"
          registry_record="$RUNNER_TEMP/mcp-registry-record.json"
          attestation_results="$RUNNER_TEMP/oci-attestation-results.json"
          curl --fail --location --proto '=https' --tlsv1.2 \
            --retry 12 --retry-delay 5 --retry-all-errors --connect-timeout 10 --max-time 15 \
            "https://registry.modelcontextprotocol.io/v0.1/servers/io.github.BargLabs%2Fcejel/versions/$version" \
            --output "$registry_record"
          gh attestation verify "oci://$IMAGE_NAME@$MCP_OCI_DIGEST" \
            --repo "$GITHUB_REPOSITORY" \
            --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/publish-distribution.yml" \
            --source-digest "$source_commit" \
            --source-ref "refs/tags/$RELEASE_TAG" \
            --format json > "$attestation_results"
          node scripts/verify-mcp-oci-release-chain.mjs \
            "$registry_record" "$attestation_results" "$version" \
            "$MCP_OCI_DIGEST" "$source_commit" "$RELEASE_TAG"
          printf 'Verified MCP Registry readback, OCI attestation subject %s, and tagged-source commit %s.\n' \
            "$MCP_OCI_DIGEST" "$source_commit" >> "$GITHUB_STEP_SUMMARY"

  verify-mcp-registry-republish-path:
    needs: resolve-mcp-oci-digest
    if: ${{ always() && inputs.verify_only && inputs.publish_mcp_registry && inputs.reuse_published_oci_tag && needs.resolve-mcp-oci-digest.result == 'success' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Checkout the dispatched release tag
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      - name: Assert release identity
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: scripts/assert-release-identity.sh

      - name: Validate republish-without-rebuild metadata
        env:
          MCP_OCI_DIGEST: ${{ needs.resolve-mcp-oci-digest.outputs.digest }}
        run: |
          node scripts/prepare-mcp-server-metadata.mjs "$MCP_OCI_DIGEST"
          node scripts/validate-distribution-metadata.mjs
          echo "verify_only=true; MCP Registry publication was skipped after resolving the published OCI digest"

  confirm-verify-only:
    needs: preflight
    if: ${{ inputs.verify_only }}
    runs-on: ubuntu-24.04
    permissions: {}
    steps:
      - name: Confirm verify-only run
        run: echo "verify_only=true; OCI image and MCP Registry publication were skipped"
