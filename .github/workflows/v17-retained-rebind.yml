name: v17 retained re-bind scan

on:
  workflow_dispatch:
    inputs:
      detector_revision:
        description: Full Cejel revision under test (must equal the preregistered revision).
        required: true
        default: d53066e0073de66d32b7e4aa58286c7c7354fedb
        type: string
      manifest_sha256:
        description: SHA-256 of the pinned manifest copied into the run artifact.
        required: true
        default: b277944058f558066f762ebcbe45dc69f6e043ee3fc4f8dceae211c07164a7a3
        type: string

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          path: harness
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: BargLabs/cejel
          ref: ${{ inputs.detector_revision }}
          path: detector
          fetch-depth: 0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.23.1
          cache: pnpm
          cache-dependency-path: detector/pnpm-lock.yaml
      - name: Build and assert the pinned detector
        working-directory: detector
        run: |
          test "$(git rev-parse HEAD)" = "${{ inputs.detector_revision }}"
          pnpm install --frozen-lockfile
          pnpm build
      - name: Record complete environment
        run: |
          mkdir -p retained-run
          {
            uname -a
            node --version
            pnpm --version
            git --version
            printf 'command=node harness/docs/experiments/v17-accuracy-rebind-2026-08-05/run-workflow-retained.mjs\n'
          } > retained-run/environment.txt
      - name: Re-scan every pinned manifest revision with retained packet inputs
        env:
          DETECTOR_ROOT: ${{ github.workspace }}/detector
          MANIFEST_PATH: ${{ github.workspace }}/harness/docs/experiments/v17-accuracy-rebind-2026-08-05/run/manifest-wave-1.json
          EXPECTED_REVISION: ${{ inputs.detector_revision }}
          EXPECTED_MANIFEST_SHA256: ${{ inputs.manifest_sha256 }}
          OUTPUT_ROOT: ${{ github.workspace }}/retained-run
        run: node harness/docs/experiments/v17-accuracy-rebind-2026-08-05/run-workflow-retained.mjs
      - name: Refuse partial results
        run: node harness/docs/experiments/v17-accuracy-rebind-2026-08-05/assert-complete-retained-run.mjs retained-run
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: v17-retained-rebind-${{ github.run_id }}
          path: retained-run
          if-no-files-found: error
          retention-days: 90
