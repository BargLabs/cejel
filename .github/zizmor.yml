# zizmor configuration for .github/workflows/workflow-lint.yml.
#
# Ignores live here only for lines that cannot carry an inline comment, or whose files should not
# change for a lint: the npm publish workflow's npm install (the clean fix moves npm into the
# lockfile, a release-path change), the CLA workflow, the two standing-constraints workflows (they
# change together with a sibling in another repository), the LLM calibration workflow (its bytes
# are hashed into calibration freeze records), the preregistered dist-determinism measurement, both
# Action definitions, and two ci.yml lines whose exact text scripts/validate-distribution-metadata.mjs
# requires. Every other ignore is an inline comment beside its line.
#
# One entry per finding, as <file>:<line>, with the reason as a comment. zizmor matches the entry
# against the file's base name, so action.yml:<line> covers action.yml and action/action.yml alike.
# A line number goes stale when its file is edited: the gate then fails on the unignored finding,
# and the entry is moved to the new line. scripts/check-workflow-lint-gate.mjs refuses an entry
# without a reason, a whole-file entry, a disabled rule and a rule configuration.

rules:
  dangerous-triggers:
    ignore:
      - cla.yml:4 # the CLA flow records a signature from a pull-request comment
      - cla.yml:6 # the CLA flow must comment on pull requests from forks

  archived-uses:
    ignore:
      - cla.yml:23 # replacing the archived CLA action is a decision of its own, left open

  artipacked:
    ignore:
      - llm-calibration.yml:79 # dispatch only, and its bytes are pinned by calibration freeze records
      - measure-dist-determinism.yml:32 # a dated, preregistered measurement; not run by a pull request
      - standing-constraints-pr.yml:29 # sibling of a workflow in another repository; the two change together
      - standing-constraints-parity.yml:45 # sibling of a workflow in another repository; the two change together

  self-repository:
    ignore:
      - ci.yml:51 # smoke-tests this repository's own root Action by local path
      - ci.yml:56 # smoke-tests this repository's own nested Action by local path

  adhoc-packages:
    ignore:
      - publish-npm.yml:165 # zizmor flags every npm install, even of a sha512-checked tarball; the clean fix moves npm into the lockfile
      - action.yml:139 # the published Action installs its sha512-checked pnpm; changing it is a product change
      - action.yml:140 # the published nested Action installs its sha512-checked pnpm; a product change
      - action.yml:166 # the published Action installs its sha512-checked pnpm; changing it is a product change
      - action.yml:167 # the published nested Action installs its sha512-checked pnpm; a product change
