name: 'Cejel Trust Check'
# Posts the result to the job summary. Intended for push and pull_request workflows only.
# GitHub Marketplace requires the description to be under 125 characters.
description: 'Evidence about a repository that anyone can rerun: test assertions, committed secrets, CI gates, pinned to one commit.'
author: 'Barg Labs Studios'
branding:
  icon: 'shield'
  color: 'green'

# How this manifest is checked, kept above inputs: on purpose: scripts/action-manifest-guard.mjs
# pins everything from inputs: to the end of the file. The inputs: and outputs: sections must match
# a SHA-256 recorded there, and runs: must match its canonical text byte for byte. No line is
# skipped, so no comment may sit below this block. Change this file and the guard together;
# lines above inputs: (name, description, author, branding, comments) stay free to edit.
#
# pnpm is installed with `npm install --prefix` into a fresh directory holding an empty package.json,
# at the exact version this action's own package.json pins in packageManager, and run from there by
# path. Nothing runs through `npm exec`, which puts the node_modules/.bin of every parent directory
# ahead of PATH, and the explicit --prefix keeps npm from adopting a parent directory (for example one
# whose package.json declares workspaces) as its project. No pnpm is added to the job's PATH,
# PNPM_HOME is not set, and setting up the toolchain never reads the calling repository's package.json:
# setup-node runs with package-manager-cache off, the only path on which it reads that file. (The scan
# itself still reads the repository it scores, by default the caller's checkout.) pnpm/action-setup did all
# three: a caller pinning a different pnpm first failed ("Multiple versions of pnpm specified"), and
# once that was fixed every later pnpm step in the caller's job ran this action's pnpm (#686).
#
# Still shared with the caller's job, as before this change: Node 22 first on PATH and setup-node's
# problem matchers; whichever node is first on PATH runs pnpm; the rest of the job's PATH and
# environment (NODE_OPTIONS, for example) reaches pnpm and the build. Also shared: npm's cache under
# ~/.npm; pnpm's default store, metadata cache and global rc file; the user, global and environment
# npm configuration, including the registry; and two cejel-pnpm.* directories left in $RUNNER_TEMP,
# each holding the installed pnpm (about 18 MB).
#
# A +hash suffix on packageManager is accepted and dropped, not verified (#686 item 6); this
# repository's distribution validator also refuses a +hash in its own package.json today.
#
# The last step deliberately does NOT cd into this action's own checkout: repo-path and the
# write-only export destination stay relative to the CALLING workflow's workspace. The report used
# for publication is first created in a fresh action-owned directory under RUNNER_TEMP.
inputs:
  repo-path:
    description: 'Path to the repository to score. Defaults to $GITHUB_WORKSPACE (the checkout).'
    required: false
    default: ''
  min-score:
    description: >-
      Optional minimum overall score (0-4). Fails this step if the scored repo is below
      the threshold. Leave empty to never fail the check.
    required: false
    default: ''
  out-dir:
    description: >-
      Empty destination to receive this invocation's report artifacts after the fresh
      runner-temporary scan completes. Existing populated destinations are refused.
    required: false
    default: '.cejel'
  rubric-pin:
    description: >-
      Explicit opt-in only: pin a rubric other than the calibrated default, for example
      witan-rubric-v27-prospective-2026-10-19. A prospective rubric carries no precision or
      recall claim. Leave empty for the calibrated default. The CLI validates the value; an
      unknown id fails this step. When pinning v27, check out with actions/checkout and
      fetch-depth: 0. v27 reads the commit history, so a shallow clone gets no full v27 result.
    required: false
    default: ''
outputs:
  score:
    description: 'Overall Cejel trust score (0.0-4.0), or empty when Cejel abstains.'
    value: ${{ steps.witan-run.outputs.score }}
  verdict:
    description: >-
      Verdict label (Verified / Conditional / At risk / Unverified / Insufficient source /
      Insufficient evidence / Unrated: shallow clone / Unrated: history depth unknown /
      Unrated: no git history).
    value: ${{ steps.witan-run.outputs.verdict }}
  limited:
    description: >-
      true when scan limitations qualify the score and verdict, or when the verdict is Unrated
      because Cejel could not read the commit history; otherwise false.
    value: ${{ steps.witan-run.outputs.limited }}
  limitation-count:
    description: 'Number of scan limitations that qualify the certificate, counting an Unrated verdict as one.'
    value: ${{ steps.witan-run.outputs['limitation-count'] }}
  limitations:
    description: 'JSON array of scan limitation messages; an Unrated verdict adds one naming its cause.'
    value: ${{ steps.witan-run.outputs.limitations }}
  artifact-dir:
    description: 'Write-only export destination containing this invocation’s report artifacts.'
    value: ${{ steps.witan-run.outputs.artifact-dir }}

runs:
  using: 'composite'
  steps:
    - name: Setup Node
      uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
      with:
        node-version: '22'
        package-manager-cache: false

    - name: Read the pnpm version this action pins
      id: cejel-pnpm
      shell: bash
      run: |
        set -euo pipefail
        cejel_dir="$GITHUB_ACTION_PATH"
        spec="$(node -e '
          const pm = require(process.argv[1]).packageManager ?? "";
          const match = /^(pnpm@\d+\.\d+\.\d+)(\+.+)?$/.exec(pm);
          if (!match) {
            console.error("package.json packageManager must pin pnpm to an exact version, got: " + pm);
            process.exit(1);
          }
          process.stdout.write(match[1]);
        ' "$cejel_dir/package.json")"
        echo "spec=$spec" >> "$GITHUB_OUTPUT"

    - name: Install dependencies
      shell: bash
      env:
        CEJEL_PNPM: ${{ steps.cejel-pnpm.outputs.spec }}
      run: |
        set -euo pipefail
        cejel_dir="$GITHUB_ACTION_PATH"
        work="$(mktemp -d "$RUNNER_TEMP/cejel-pnpm.XXXXXX")"
        cd "$work"
        printf '{}\n' > package.json
        npm install --prefix "$work" --no-save --no-package-lock --ignore-scripts --no-audit --no-fund "$CEJEL_PNPM"
        pnpm="$work/node_modules/.bin/pnpm"
        ran="pnpm@$("$pnpm" --version)"
        if [ "$ran" != "$CEJEL_PNPM" ]; then
          echo "::error::expected $CEJEL_PNPM from this action's package.json, installed $ran"
          exit 1
        fi
        "$pnpm" --dir "$cejel_dir" install --frozen-lockfile

    - name: Build the Cejel CLI
      shell: bash
      env:
        CEJEL_PNPM: ${{ steps.cejel-pnpm.outputs.spec }}
      run: |
        set -euo pipefail
        cejel_dir="$GITHUB_ACTION_PATH"
        work="$(mktemp -d "$RUNNER_TEMP/cejel-pnpm.XXXXXX")"
        cd "$work"
        printf '{}\n' > package.json
        npm install --prefix "$work" --no-save --no-package-lock --ignore-scripts --no-audit --no-fund "$CEJEL_PNPM"
        pnpm="$work/node_modules/.bin/pnpm"
        ran="pnpm@$("$pnpm" --version)"
        if [ "$ran" != "$CEJEL_PNPM" ]; then
          echo "::error::expected $CEJEL_PNPM from this action's package.json, installed $ran"
          exit 1
        fi
        "$pnpm" --dir "$cejel_dir" run build

    - name: Run Cejel (offline scoring — no network calls, no signup)
      id: witan-run
      shell: bash
      run: node "$GITHUB_ACTION_PATH/action/run.mjs"
      env:
        WITAN_REPO_PATH: ${{ inputs.repo-path }}
        WITAN_MIN_SCORE: ${{ inputs.min-score }}
        WITAN_EXPORT_DIR: ${{ inputs.out-dir }}
        WITAN_RUBRIC_PIN: ${{ inputs.rubric-pin }}
